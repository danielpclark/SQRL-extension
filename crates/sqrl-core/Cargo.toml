[package]
name = "sqrl-core"
description = "Pure-Rust implementation of the SQRL (Secure Quick Reliable Login) client protocol, S4 identity storage and identity lock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std", "zeroize"] }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
scrypt = { version = "0.11", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
getrandom = { version = "0.2", features = ["js"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = { version = "2", default-features = false }

[features]
default = ["server"]
# Reference server-side logic (used by the test server and by the flow tests).
server = []
